<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>88 Snooker Club Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🎱 88 Snooker</h2>

        <button id="menuDashboard">📊 Dashboard</button>

        <button id="menuTables">🎱 โต๊ะสนุกเกอร์</button>

        <button id="menuFood" disabled>
            🥤 อาหาร / เครื่องดื่ม
        </button>

        <button id="menuMembers" disabled>
            👥 สมาชิก
        </button>

        <button id="menuReports" disabled>
            📈 รายงาน
        </button>

        <button id="settingButton">
            ⚙️ ตั้งค่า
        </button>

    </aside>

    <!-- Main -->
    <main class="content">

        <header class="topbar">

            <div>

                <h1>🎱 88 Snooker Club Manager</h1>

                <small>
                    Version 1.2.0
                </small>

            </div>

        </header>

        <!-- Dashboard -->

        <section class="summary">

            <div class="card">

                <h3>💰 รายได้วันนี้</h3>

                <h2 id="income">0.00 บาท</h2>

            </div>

            <div class="card">

                <h3>⚙️ อัตราค่าบริการ</h3>

                <h2 id="hourlyRateDisplay">
                    100 บาท / ชั่วโมง
                </h2>

                <small id="minimumChargeDisplay">
                    ขั้นต่ำ 50 บาท
                </small>

            </div>

        </section>

        <section class="dashboard">

            <div class="card">

                <h3>🎱 โต๊ะทั้งหมด</h3>

                <h2 id="totalTables">0</h2>

            </div>

            <div class="card">

                <h3>🟢 กำลังเล่น</h3>

                <h2 id="playingTables">0</h2>

            </div>

            <div class="card">

                <h3>🔴 ว่าง</h3>

                <h2 id="freeTables">0</h2>

            </div>

        </section>

        <h2>โต๊ะสนุกเกอร์</h2>

        <div id="tables"></div>

    </main>

</div>

<!-- Settings -->

<div id="settingsModal" class="modal">

    <div class="modal-content">

        <h2>⚙️ ตั้งค่าร้าน</h2>

        <label>ราคาต่อชั่วโมง</label>

        <input
            type="number"
            id="hourlyRateInput">

        <label>ค่าบริการขั้นต่ำ</label>

        <input
            type="number"
            id="minimumChargeInput">

        <br><br>

        <button id="saveSettings">

            💾 บันทึก

        </button>

        <button id="closeSettings">

            ❌ ปิด

        </button>

    </div>

</div>

<script src="js/settings.js"></script>

<script src="js/modules/billing.js"></script>

<script src="js/modules/timer.js"></script>

<script src="js/app.js"></script>

</body>

</html>
