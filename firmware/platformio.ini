[platformio]
default_envs = esp32dev
test_dir = tests

[env]
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@^7.2.1

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_type = release
upload_speed = 921600

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c++17
  -Isrc
build_src_filter =
  +<relay/RelayService.cpp>
